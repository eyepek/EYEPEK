var WHEN=[["As soon as possible","जल्द से जल्द"],["This week","इस हफ़्ते"],["I will pick a date","तारीख़ चुनूँगा"]];
var TC={plumbing:"#2563eb",electrician:"#d97706",home:"#0f9d6a"};
var app=document.getElementById("app"),query="",view="home",curS=null,curF={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ld(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function go(){window.scrollTo(0,0)}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function err(t){document.getElementById("er").textContent=t}

function chrome(){
 document.documentElement.lang=LANG;
 document.getElementById("tg").textContent=T("tag");
 document.getElementById("lg").innerHTML='<button class="'+(LANG==="en"?"on":"")+'" data-l="en">EN</button><button class="'+(LANG==="hi"?"on":"")+'" data-l="hi">हिं</button>';
 document.querySelectorAll("#lg button").forEach(function(b){b.onclick=function(){if(b.dataset.l===LANG)return;if(view==="form")snap();LANG=b.dataset.l;sv("ep_lang",LANG);render()}});
 document.getElementById("bar").innerHTML='<a class="btn ghost" href="tel:+'+PHONE+'">'+T("call")+'</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(T("hi"))+'">'+T("wa")+'</a>';
}
function render(){chrome();if(view==="home")home();else if(view==="form")form();else done()}

function home(){
 var h='<div class="hero"><div class="eb">EYEPEK life begins here</div><h1>'+T("h1")+'</h1><p>'+T("hp")+'</p><div class="row"><a class="btn" href="#svc">'+T("book")+'</a><a class="btn ghost" href="tel:+'+PHONE+'">'+T("calln")+'</a></div></div>';
 h+='<div class="strip"><span><b>11</b>'+T("s1")+'</span><span><b>3</b>'+T("s2")+'</span><span><b>'+T("m1")+'</b>'+T("s3")+'</span></div>';
 h+='<h2 class="s">'+T("how")+'</h2>';
 [1,2,3].forEach(function(n){h+='<div class="box"><i>'+n+'</i><span><b>'+T("h"+n+"t")+'</b><p>'+T("h"+n+"d")+'</p></span></div>'});
 h+='<h2 class="s" id="svc">'+T("our")+'</h2><p class="sub">'+T("sel")+'</p><input class="search" id="sq" type="search" placeholder="'+esc(T("ph"))+'" value="'+esc(query)+'"><div id="lst"></div>';
 if(REVIEWS.length){h+='<h2 class="s">'+T("rev")+'</h2>';REVIEWS.forEach(function(r){h+='<div class="box"><p class="rv">“'+esc(L(r.text))+'”<small>— '+esc(r.name)+'</small></p></div>'})}
 if(GALLERY.length){h+='<h2 class="s">'+T("gal")+'</h2><div class="gal">';GALLERY.forEach(function(u){h+='<img loading="lazy" alt="" src="'+esc(u)+'">'});h+='</div>'}
 h+='<h2 class="s">'+T("faq")+'</h2>';
 FAQ.forEach(function(f){h+='<details><summary>'+esc(L(f[0]))+'</summary><p>'+esc(L(f[1]))+'</p></details>'});
 h+='<div class="contact card"><h2 class="s" style="margin-top:0">'+T("cu")+'</h2><p>+91 70043 74250</p><p>'+esc(EMAIL)+'</p>';
 if(L(HOURS))h+='<p class="note"><b>'+T("hrs")+':</b> '+esc(L(HOURS))+'</p>';
 h+='<div class="row" style="justify-content:center"><a class="btn ghost" href="mailto:'+EMAIL+'">'+T("em")+'</a></div></div>';
 app.innerHTML=h;
 var sq=document.getElementById("sq");sq.oninput=function(){query=sq.value;draw()};draw();
}
function draw(){
 var q=query.trim().toLowerCase(),h="",c=0;
 G.forEach(function(g,gi){
  var m=S.filter(function(s){return s.g===gi&&(!q||(s.n.join(" ")+" "+s.d.join(" ")).toLowerCase().indexOf(q)>-1)});
  if(!m.length)return;
  h+='<h3>'+L(g)+'</h3>';
  if(gi===0){h+='<div class="edu"><div class="edh"><b>'+T("edsub")+'</b><span>★ '+T("feat")+'</span></div>';m.forEach(function(s,n){c++;h+='<button class="svc" style="--c:'+(n%2?"var(--org)":"var(--blu)")+'" data-id="'+s.id+'"><span class="ic">'+I(s.i)+'</span><span><b>'+esc(L(s.n))+'</b><small>'+esc(L(s.d))+'</small><span class="pr">'+esc(PRICES[s.id]?L(PRICES[s.id]):T("quote"))+'</span></span><span class="ar">›</span></button>'});h+='</div>';return}
  if(gi===2){h+='<div class="tiles">';m.forEach(function(s){c++;h+='<button class="svc tile" style="--c:'+(TC[s.id]||"#2563eb")+'" data-id="'+s.id+'" title="'+esc(L(s.d))+'"><span class="ti">'+I(s.i,30)+'</span><b>'+esc(L(s.n))+'</b><span class="pr">'+esc(PRICES[s.id]?L(PRICES[s.id]):T("quote"))+'</span></button>'});h+='</div>';return}
  m.forEach(function(s){c++;h+='<button class="svc" data-id="'+s.id+'"><span class="ic">'+I(s.i)+'</span><span><b>'+esc(L(s.n))+'</b><small>'+esc(L(s.d))+'</small><span class="pr">'+esc(PRICES[s.id]?L(PRICES[s.id]):T("quote"))+'</span></span><span class="ar">›</span></button>'});
 });
 if(!c)h='<div class="empty">'+T("none")+'</div>';
 var l=document.getElementById("lst");l.innerHTML=h;
 l.querySelectorAll(".svc").forEach(function(b){b.onclick=function(){curS=S.filter(function(s){return s.id===b.dataset.id})[0];curF={};view="form";go();render()}});
}
function steps(n,t){return '<div class="steps"><i class="on"></i><i class="'+(n>1?'on':'')+'"></i><i class="'+(n>2?'on':'')+'"></i></div><p class="stl">'+T("step")+' '+n+' '+T("of")+' 3 · '+t+'</p>'}
function chips(id,arr,sel){var h='<div class="chips" id="'+id+'">';arr.forEach(function(o,n){h+='<button type="button" class="chip'+(n===sel?' on':'')+'" data-v="'+n+'">'+esc(L(o))+'</button>'});return h+'</div>'}
function bind(id,cb){var w=document.getElementById(id);w.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){w.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")});b.classList.add("on");if(cb)cb(+b.dataset.v)}})}
function pick(id){var o=document.querySelector("#"+id+" .chip.on");return o?+o.dataset.v:-1}
function snap(){curF={x:pick("c1"),w:Math.max(pick("c2"),0),d:val("d"),n:val("n"),p:val("p"),a:val("a"),m:val("m")}}

function form(){
 var s=curS,v=curF,w0=(v.w==null?0:v.w);
 var h='<button class="back" id="bk">'+T("back")+'</button><div class="card">'+steps(2,T("yd"))+'<span class="tag"><span class="ic" style="width:28px;height:28px;border-radius:8px">'+I(s.i,16)+'</span>'+esc(L(s.n))+'</span>';
 h+='<div class="lb">'+esc(L(s.q))+'</div>'+chips("c1",s.o,v.x==null?-1:v.x);
 h+='<div class="lb">'+T("when")+'</div>'+chips("c2",WHEN,w0);
 h+='<div id="dw" style="display:'+(w0===2?'block':'none')+'"><label for="d">'+T("date")+'</label><input id="d" type="date" value="'+esc(v.d||"")+'"></div>';
 h+='<label for="n">'+T("name")+'</label><input id="n" autocomplete="name" value="'+esc(v.n||ld("ep_n"))+'">';
 h+='<label for="p">'+T("phone")+'</label><input id="p" type="tel" inputmode="numeric" autocomplete="tel" value="'+esc(v.p||ld("ep_p"))+'">';
 h+='<label for="a">'+T("city")+'</label><input id="a" autocomplete="street-address" value="'+esc(v.a||ld("ep_a"))+'">';
 h+='<label for="m">'+T("more")+'</label><textarea id="m" rows="2">'+esc(v.m||"")+'</textarea>';
 h+='<div class="err" id="er"></div><div class="row" style="margin-top:4px"><button class="btn" id="go" style="width:100%">'+T("cont")+'</button></div></div>';
 app.innerHTML=h;
 var dw=document.getElementById("dw");bind("c1");bind("c2",function(x){dw.style.display=x===2?"block":"none"});
 document.getElementById("bk").onclick=function(){view="home";go();render()};
 document.getElementById("go").onclick=function(){
  snap();var f=curF;
  if(!f.n)return err(T("e1"));
  if(f.p.replace(/\D/g,"").length<10)return err(T("e2"));
  if(!f.a)return err(T("e3"));
  if(f.w===2&&!f.d)return err(T("e4"));
  sv("ep_n",f.n);sv("ep_p",f.p);sv("ep_a",f.a);view="done";go();render();
 };
}
function msg(){
 var s=curS,f=curF;
 return T("br")+"\n"+T("sv")+": "+L(s.n)+(f.x>=0?"\n"+L(s.q)+": "+L(s.o[f.x]):"")+"\n"+T("wn")+": "+(f.w===2?f.d:L(WHEN[f.w]))+"\n"+T("nm")+": "+f.n+"\n"+T("ph2")+": "+f.p+"\n"+T("ct")+": "+f.a+(f.m?"\n"+T("nt")+": "+f.m:"");
}
function done(){
 var t=msg();
 var h='<div class="card">'+steps(3,T("sr"))+'<p class="ok">'+T("ready")+'</p><p class="note" style="margin:0">'+T("rv")+'</p><pre>'+esc(t)+'</pre>';
 h+='<div class="row" style="margin-top:0"><a class="btn" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(t)+'">'+T("swa")+'</a><a class="btn ghost" href="mailto:'+EMAIL+'?subject='+encodeURIComponent(T("br")+": "+L(curS.n))+'&body='+encodeURIComponent(t)+'">'+T("sem")+'</a><button class="btn ghost" id="cp">'+T("copy")+'</button></div><div class="note" id="cm" style="margin-top:8px"></div>';
 h+='<ol class="next"><li>'+T("n1")+'</li><li>'+T("n2")+'</li><li>'+T("n3")+'</li></ol>';
 h+='<div class="row"><button class="btn ghost" id="ed">'+T("ed")+'</button><button class="btn ghost" id="hm">'+T("nb")+'</button></div></div>';
 app.innerHTML=h;
 document.getElementById("cp").onclick=function(){var m=document.getElementById("cm");try{navigator.clipboard.writeText(t).then(function(){m.textContent=T("copied")},function(){m.textContent=T("cf")})}catch(e){m.textContent=T("cf")}};
 document.getElementById("ed").onclick=function(){view="form";go();render()};
 document.getElementById("hm").onclick=function(){query="";curF={};view="home";go();render()};
}
render();
</script>
