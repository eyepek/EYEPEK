name: eyepek_app
description: EYEPEK education, admissions, affiliation and support app.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/eyepek-app-icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/eyepek-app-icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/eyepek-app-icon.png
  min_sdk_android: 21
